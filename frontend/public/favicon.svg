<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Deep void background matching app theme -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#08080f"/>
    </radialGradient>
    <!-- Blue-teal gradient for the water/mind swirl (MTG blue) -->
    <radialGradient id="mindGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#2a6fa8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d2a45" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold glow for lightning -->
    <radialGradient id="lightningGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <!-- Storm pink/purple glow (from the card art) -->
    <radialGradient id="stormGlow" cx="50%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#7a2060" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7a2060" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="url(#bgGrad)"/>

  <!-- Storm glow -->
  <rect width="32" height="32" rx="4" fill="url(#stormGlow)"/>
  <rect width="32" height="32" rx="4" fill="url(#mindGlow)"/>
  <rect width="32" height="32" rx="4" fill="url(#lightningGlow)"/>

  <!-- Subtle MTG-card style border -->
  <rect x="1" y="1" width="30" height="30" rx="3.5" fill="none" 
        stroke="#4a8ab5" stroke-width="0.6" opacity="0.6"/>
  <rect x="2" y="2" width="28" height="28" rx="3" fill="none" 
        stroke="#c9a84c" stroke-width="0.3" opacity="0.3"/>

  <!-- Brain/head silhouette - simplified iconic shape -->
  <!-- Skull base -->
  <ellipse cx="16" cy="20" rx="6" ry="4" fill="#0a0a18" opacity="0.8"/>
  <!-- Brain dome -->
  <path d="M10 18 C10 11, 22 11, 22 18" fill="#1a2035" stroke="#3a5a8a" stroke-width="0.5" opacity="0.9"/>
  <!-- Left hemisphere groove -->
  <path d="M16 11.5 L16 18" stroke="#2a4a6a" stroke-width="0.4" opacity="0.6"/>
  <!-- Brain wrinkle hints -->
  <path d="M11.5 14 C12 13, 13 13.5, 13 14.5" fill="none" stroke="#3a6a9a" stroke-width="0.4" opacity="0.5"/>
  <path d="M19 14 C19.5 13, 20.5 13.5, 20.5 14.5" fill="none" stroke="#3a6a9a" stroke-width="0.4" opacity="0.5"/>
  <path d="M12.5 16.5 C13 15.5, 14.5 16, 14.5 17" fill="none" stroke="#3a6a9a" stroke-width="0.4" opacity="0.5"/>
  <path d="M17.5 16.5 C18 15.5, 19.5 16, 19.5 17" fill="none" stroke="#3a6a9a" stroke-width="0.4" opacity="0.5"/>
  <!-- Eyes (glowing white like the card) -->
  <ellipse cx="13.5" cy="19.2" rx="1.1" ry="0.7" fill="#c8e8ff" filter="url(#strongGlow)" opacity="0.95"/>
  <ellipse cx="18.5" cy="19.2" rx="1.1" ry="0.7" fill="#c8e8ff" filter="url(#strongGlow)" opacity="0.95"/>

  <!-- Lightning bolts - main dramatic one -->
  <!-- Left bolt -->
  <polyline points="8,4 10,10 8.5,10 11,17" 
            fill="none" stroke="#e8d870" stroke-width="1.2" 
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#glow)" opacity="0.9"/>
  <!-- Right bolt -->
  <polyline points="24,4 22,10 23.5,10 21,17" 
            fill="none" stroke="#e8d870" stroke-width="1.2" 
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#glow)" opacity="0.9"/>

  <!-- Small secondary sparks -->
  <line x1="7" y1="7" x2="5" y2="6" stroke="#c9a84c" stroke-width="0.6" opacity="0.7"/>
  <line x1="25" y1="7" x2="27" y2="6" stroke="#c9a84c" stroke-width="0.6" opacity="0.7"/>
  <line x1="8" y1="9" x2="6" y2="10" stroke="#c9a84c" stroke-width="0.5" opacity="0.5"/>
  <line x1="24" y1="9" x2="26" y2="10" stroke="#c9a84c" stroke-width="0.5" opacity="0.5"/>

  <!-- Storm clouds at top - swirling arcs -->
  <path d="M4 6 Q7 3, 10 5 Q11 2, 14 4" fill="none" stroke="#7a3080" stroke-width="0.8" opacity="0.6" stroke-linecap="round"/>
  <path d="M28 6 Q25 3, 22 5 Q21 2, 18 4" fill="none" stroke="#7a3080" stroke-width="0.8" opacity="0.6" stroke-linecap="round"/>

  <!-- Mana symbol (blue water drop) in top right corner, tiny -->
  <circle cx="27.5" cy="4.5" r="2" fill="#0d2a45" stroke="#4a8ab5" stroke-width="0.4" opacity="0.9"/>
  <ellipse cx="27.5" cy="5" rx="0.8" ry="1.1" fill="#6ab4d8" opacity="0.8"/>
  <path d="M27.5 3.2 Q28.3 4, 27.5 5.5 Q26.7 4, 27.5 3.2Z" fill="#8ad4f8" opacity="0.6"/>
</svg>
