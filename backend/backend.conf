# /etc/nginx/conf.d/backend.conf
#
# Install first (Amazon Linux — ec2-user login confirms this, not Ubuntu):
#   sudo dnf update -y
#   sudo dnf install -y nginx
#   sudo systemctl enable nginx --now
#
# Amazon Linux's nginx auto-loads everything in /etc/nginx/conf.d/*.conf —
# no sites-available/sites-enabled symlinking needed (that's a Debian/
# Ubuntu convention). Just place this file there directly, then:
#   sudo nginx -t && sudo systemctl reload nginx
# All three instances (brainstorm-1, brainstorm-2, brainstorm-lb) are in
# us-east-2, just different AZs (2a/2c) — private IPs route fine across
# AZs within the same VPC/region, no peering or public IPs needed for
# this hop. Lock each app instance's security group to only accept
# inbound :5002 from the LB's private IP or (better) its SG ID, and stop
# exposing :5002 publicly on brainstorm-1/2 once this is live.

upstream backend_app {
    server 172.31.3.68:5002 max_fails=3 fail_timeout=15s;   # brainstorm-1, us-east-2a
    server 172.31.39.245:5002 max_fails=3 fail_timeout=15s;  # brainstorm-2, us-east-2c

    # max_fails/fail_timeout = open-source Nginx's passive health check:
    # after 3 failed proxy attempts within 15s, that upstream is marked
    # down for 15s and traffic goes to the other instance. There's no
    # active probing (that's Nginx Plus only) — a genuinely hung-but-
    # still-accepting-connections instance won't be caught by this alone.
    # Your Docker HEALTHCHECK restarts a hung container, which is the
    # other half of this safety net.
}

# WebSocket upgrade requires this: Nginx doesn't forward the Upgrade
# header by default, and since you're forcing WS transport in
# Socket.IO (not letting it fall back to polling), a missing upgrade
# header here means every socket connection fails outright.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name brainstorm.ink;  # match whatever CLIENT_URL points to

    location / {
        proxy_pass http://backend_app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # These three are what your app's `trust proxy` setting reads —
        # without them, req.ip / rate-limiting / any IP-based logic in
        # Express sees Nginx's IP for every request instead of the
        # real client.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO connections are long-lived — default Nginx proxy
        # timeouts (60s) will silently kill idle-but-legitimate socket
        # connections. Match this to something longer than your
        # activity/inactivity TTLs in redisGameState.js.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Once this is working over plain HTTP, add TLS with:
#   sudo dnf install -y python3-certbot-nginx  # AL2023; if unavailable, use snap/pip certbot instead
#   sudo certbot --nginx -d brainstorm.ink
# certbot rewrites this file to add a 443 server block + redirect —
# run it only after confirming plain HTTP routing works end to end.